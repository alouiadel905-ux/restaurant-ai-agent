<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Capital — Test Agent IA</title>
<style>
  :root {
    --bg: #141110;
    --panel: #1d1a18;
    --red: #d62828;
    --red-dark: #a11f1f;
    --text: #f2ede8;
    --text-dim: #a89e96;
    --bubble-user: #2a2624;
    --bubble-agent: #d62828;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    width: 100%;
    max-width: 640px;
    padding: 20px 16px 12px;
    text-align: center;
    border-bottom: 1px solid #2a2624;
  }

  header h1 {
    margin: 0;
    font-size: 1.5rem;
    letter-spacing: 0.5px;
  }

  header h1 span {
    color: var(--red);
  }

  header p {
    margin: 4px 0 0;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  #chat {
    flex: 1;
    width: 100%;
    max-width: 640px;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    font-size: 0.95rem;
  }

  .bubble.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }

  .bubble.agent {
    align-self: flex-start;
    background: var(--bubble-agent);
    border-bottom-left-radius: 4px;
  }

  .bubble.system {
    align-self: center;
    background: transparent;
    border: 1px dashed var(--text-dim);
    color: var(--text-dim);
    font-size: 0.8rem;
    text-align: center;
  }

  #order-banner {
    display: none;
    width: 100%;
    max-width: 640px;
    background: #2f7a3d;
    color: white;
    text-align: center;
    padding: 8px;
    font-size: 0.85rem;
  }

  form {
    width: 100%;
    max-width: 640px;
    display: flex;
    gap: 8px;
    padding: 12px 16px 20px;
    border-top: 1px solid #2a2624;
  }

  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid #3a3532;
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 0.95rem;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: var(--red);
  }

  button {
    background: var(--red);
    color: white;
    border: none;
    padding: 0 20px;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
  }

  button:hover {
    background: var(--red-dark);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<header>
  <h1>La <span>Capital</span></h1>
  <p>Test de l'agent IA — prise de commande</p>
</header>

<div id="order-banner"></div>

<div id="chat"></div>

<form id="chat-form">
  <input type="text" id="message-input" placeholder="Écrivez votre message..." autocomplete="off" required>
  <button type="submit" id="send-btn">Envoyer</button>
</form>

<script>
  const API_URL = "http://127.0.0.1:8000/chat";

  let sessionId = null;

  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("chat-form");
  const inputEl = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");
  const bannerEl = document.getElementById("order-banner");

  function addBubble(text, role) {
    const bubble = document.createElement("div");
    bubble.className = "bubble " + role;
    bubble.textContent = text;
    chatEl.appendChild(bubble);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  addBubble("Conversation démarrée. Écrivez votre premier message pour commencer.", "system");

  formEl.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = inputEl.value.trim();
    if (!message) return;

    addBubble(message, "user");
    inputEl.value = "";
    sendBtn.disabled = true;

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: message }),
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        addBubble("Erreur serveur : " + (errorData.detail || response.status), "system");
        sendBtn.disabled = false;
        return;
      }

      const data = await response.json();
      sessionId = data.session_id;

      addBubble(data.reply, "agent");

      if (data.order_confirmed) {
        bannerEl.textContent = "✅ Commande confirmée et enregistrée !";
        bannerEl.style.display = "block";
      }
    } catch (err) {
      addBubble("Impossible de contacter le serveur. Le serveur (uvicorn) est-il bien lancé ?", "system");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  });
</script>

</body>
</html>
